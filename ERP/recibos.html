<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hidromec ERP — Recibos de Sueldo</title>
<link rel="stylesheet" href="erp-layout.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="erp-utils.js"></script>
<script src="erp-sidebar.js"></script>
<script src="empresas.api.js"></script>
<style>
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  @media(max-width:768px){.main{margin-left:0;padding:16px;}.kpi-grid{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>
<div id="overlay" class="overlay" onclick="ERP.closeSidebar()"></div>
<div id="sidebar-root"></div>

<main class="main">
  <div class="page-header">
    <h2>Recibos de Sueldo <span id="badge-noconforme" style="display:none;background:var(--red);color:#fff;border-radius:20px;padding:2px 9px;font-size:12px;margin-left:8px;vertical-align:middle"></span></h2>
    <span style="font-size:12px;color:var(--muted)">Portal separado del ERP — ver <a href="#" style="color:var(--blue)" onclick="alert('portal-login.html — sistema aparte, dominio propio, empleados no tienen acceso a nada de este ERP.');return false">detalle</a></span>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="cambiarTabRecibos('empleados',this)">Accesos de empleados</button>
    <button class="tab" onclick="cambiarTabRecibos('cargar',this)">Cargar recibos</button>
    <button class="tab" onclick="cambiarTabRecibos('estado',this)">Estado de firmas</button>
    <button class="tab" onclick="cambiarTabRecibos('disconf',this)">⚠ Disconformidades <span id="badge-tab-noconforme" style="display:none;background:var(--red);color:#fff;border-radius:20px;padding:1px 7px;font-size:11px;margin-left:4px"></span></button>
    <button class="tab" onclick="cambiarTabRecibos('legajo',this)">🪪 Legajo digital <span id="badge-tab-legajo" style="display:none;background:var(--orange);color:#fff;border-radius:20px;padding:1px 7px;font-size:11px;margin-left:4px"></span></button>
    <button class="tab" onclick="cambiarTabRecibos('avisos',this)">📢 Avisos y formularios</button>
  </div>

  <div class="panel">
    <div id="contenido"><div class="spinner-wrap"><div class="spinner"></div>Cargando...</div></div>
  </div>
</main>

<!-- MODAL EMPLEADO DEL PORTAL -->
<div class="modal-overlay" id="modal-portal-empleado">
  <div class="modal" style="max-width:420px">
    <h3 id="pe-titulo">Nuevo acceso al portal</h3>
    <p style="font-size:12px;color:var(--muted);margin-bottom:18px">Esto NO crea un empleado en el ERP — es solo su acceso al portal de recibos, un sistema aparte por seguridad.</p>
    <div class="form-group" style="margin-bottom:14px">
      <label>Documento (DNI)</label>
      <input type="text" id="pe-dni" placeholder="Sin puntos">
    </div>
    <div class="form-group" style="margin-bottom:14px">
      <label>Nombre completo</label>
      <input type="text" id="pe-nombre" placeholder="Nombre y apellido">
    </div>
    <div class="form-group" style="margin-bottom:14px">
      <label>Email real <span style="color:var(--muted);font-weight:400;text-transform:none;font-size:11px">(ahí le va a llegar el código para activar su cuenta)</span></label>
      <input type="email" id="pe-email" placeholder="empleado@email.com">
    </div>
    <div class="form-group" style="margin-bottom:14px">
      <label>Activo</label>
      <select id="pe-activo"><option value="true">Sí</option><option value="false">No</option></select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="cerrarModal('modal-portal-empleado')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarPortalEmpleado()">Guardar</button>
    </div>
  </div>
</div>

<script>
// SUPA_URL, SUPA_KEY y db ya vienen declarados globalmente por erp-utils.js

async function init(){
  const usuario = await ERP.initLayout('recibos');
  if(!usuario) return;
  await cargarBadgeNoConforme();
  cargarTabRecibos();
}

// ══════════════════════════════════════════════════════════════
// NAVEGACIÓN
// ══════════════════════════════════════════════════════════════
let _tabRecibos='empleados';
let _portalEmpleadosCache=[];

function cambiarTabRecibos(tab, btn){
  _tabRecibos=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(btn) btn.classList.add('active');
  cargarTabRecibos();
}

async function cargarTabRecibos(){
  document.getElementById('contenido').innerHTML='<div class="spinner-wrap"><div class="spinner"></div></div>';
  const { data } = await db.from('portal_empleados').select('*').order('nombre');
  _portalEmpleadosCache = data||[];

  if(_tabRecibos==='empleados') renderPortalEmpleados();
  else if(_tabRecibos==='cargar') renderPortalCargar();
  else if(_tabRecibos==='estado') renderPortalEstado();
  else if(_tabRecibos==='disconf') renderNotificaciones();
  else if(_tabRecibos==='legajo') renderLegajos();
  else renderAvisos();
}

async function cargarBadgeNoConforme(){
  const { count } = await db.from('portal_recibos')
    .select('*', { count:'exact', head:true })
    .eq('conformidad','no_conforme');
  if(count>0){
    document.getElementById('badge-noconforme').textContent = count+' sin revisar';
    document.getElementById('badge-noconforme').style.display='';
    document.getElementById('badge-tab-noconforme').textContent = count;
    document.getElementById('badge-tab-noconforme').style.display='';
  }
  const { count: countLegajo } = await db.from('portal_empleados')
    .select('*', { count:'exact', head:true })
    .eq('docs_estado','en_revision');
  if(countLegajo>0){
    document.getElementById('badge-tab-legajo').textContent = countLegajo;
    document.getElementById('badge-tab-legajo').style.display='';
  }
}

function fmtFH(f){
  if(!f) return '—';
  return new Date(f).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function fmtPeriodoLabel(p){
  const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const m=p.match(/^(\d{4})-(\d{2})$/);
  if(!m) return p;
  return meses[parseInt(m[2],10)-1] + ' ' + m[1];
}

// ══════════════════════════════════════════════════════════════
// ACCESOS DE EMPLEADOS
// ══════════════════════════════════════════════════════════════
function renderPortalEmpleados(){
  const cont=document.getElementById('contenido');
  cont.innerHTML=`
    <div class="panel-header">
      <h3>Accesos de empleados</h3>
      <button class="btn btn-primary btn-sm" onclick="abrirModalPortalEmpleado()">+ Nuevo acceso</button>
    </div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>DNI</th><th>Nombre</th><th>Email</th><th>Estado cuenta</th><th>Activo</th><th></th></tr></thead>
      <tbody>${_portalEmpleadosCache.length?_portalEmpleadosCache.map(pe=>`
        <tr>
          <td class="mono">${pe.dni}</td>
          <td>${pe.nombre}</td>
          <td style="font-size:12px;color:var(--muted)">${pe.email}</td>
          <td><span class="estado ${pe.auth_user_id?'activo':'pendiente'}">${pe.auth_user_id?'Activada':'Sin activar'}</span></td>
          <td><span class="estado ${pe.activo?'activo':'anulada'}">${pe.activo?'Sí':'No'}</span></td>
          <td><button class="btn btn-sm btn-ghost" onclick='abrirModalPortalEmpleado(${JSON.stringify(pe).replace(/'/g,"&apos;")})'>Editar</button></td>
        </tr>`).join(''):'<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:30px">Sin accesos cargados todavía.</td></tr>'}</tbody>
    </table></div>`;
}

let _peEditId=null;
function abrirModalPortalEmpleado(pe){
  _peEditId = pe ? pe.id : null;
  document.getElementById('pe-titulo').textContent = pe ? 'Editar acceso' : 'Nuevo acceso al portal';
  document.getElementById('pe-dni').value = pe ? pe.dni : '';
  document.getElementById('pe-nombre').value = pe ? pe.nombre : '';
  document.getElementById('pe-email').value = pe ? pe.email : '';
  document.getElementById('pe-activo').value = pe ? String(pe.activo) : 'true';
  document.getElementById('modal-portal-empleado').classList.add('show');
}

async function guardarPortalEmpleado(){
  const dni=document.getElementById('pe-dni').value.trim().replace(/\./g,'');
  const nombre=document.getElementById('pe-nombre').value.trim();
  const email=document.getElementById('pe-email').value.trim().toLowerCase();
  const activo=document.getElementById('pe-activo').value==='true';

  if(!dni||!nombre||!email){ toast('Completá DNI, nombre y email.','warn'); return; }

  try{
    if(_peEditId){
      const { error } = await db.from('portal_empleados').update({dni,nombre,email,activo}).eq('id',_peEditId);
      if(error) throw error;
      toast('Acceso actualizado','success');
    } else {
      const { error } = await db.from('portal_empleados').insert({dni,nombre,email,activo});
      if(error) throw error;
      toast('Acceso creado — avisale que puede activarlo desde "¿Primera vez?" en el portal','success');
    }
    cerrarModal('modal-portal-empleado');
    cargarTabRecibos();
  }catch(e){
    if(String(e.message||'').includes('duplicate')||String(e.code)==='23505'){
      toast('Ya existe un acceso con ese DNI.','error');
    } else {
      toast('Error: '+(e?.message||String(e)),'error');
    }
  }
}

// ══════════════════════════════════════════════════════════════
// CARGAR RECIBOS
// ══════════════════════════════════════════════════════════════
let _archivosACargar=[];

function renderPortalCargar(){
  const cont=document.getElementById('contenido');
  const hoy=new Date();
  const periodoDefault=`${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}`;
  cont.innerHTML=`
    <div class="panel-header"><h3>Cargar recibos</h3></div>
    <div style="padding:20px;max-width:600px">
      <div class="form-group" style="margin-bottom:14px">
        <label>Período</label>
        <input type="month" id="pc-periodo" value="${periodoDefault}">
      </div>
      <div class="form-group" style="margin-bottom:14px">
        <label>Archivos PDF <span style="color:var(--muted);font-weight:400;text-transform:none;font-size:11px">(nombrá cada archivo con el DNI del empleado, ej: "30123456.pdf")</span></label>
        <input type="file" id="pc-archivos" accept="application/pdf" multiple onchange="previsualizarCarga()">
      </div>
      <div id="pc-preview"></div>
      <button class="btn btn-primary" id="pc-btn-subir" style="display:none;margin-top:14px" onclick="subirRecibos()">Subir recibos</button>
    </div>`;
}

function previsualizarCarga(){
  const input=document.getElementById('pc-archivos');
  _archivosACargar = [...input.files].map(f=>{
    const dniArchivo = f.name.replace(/\.pdf$/i,'').trim().replace(/\./g,'');
    const match = _portalEmpleadosCache.find(pe=>pe.dni===dniArchivo);
    return { file:f, dni:dniArchivo, empleado:match||null };
  });

  const preview=document.getElementById('pc-preview');
  const encontrados=_archivosACargar.filter(a=>a.empleado).length;
  preview.innerHTML=`
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px">${encontrados} de ${_archivosACargar.length} archivos matcheados con un empleado</div>
    <table>
      <thead><tr><th>Archivo</th><th>DNI detectado</th><th>Empleado</th><th>Estado</th></tr></thead>
      <tbody>${_archivosACargar.map(a=>`
        <tr>
          <td style="font-size:12px">${a.file.name}</td>
          <td class="mono">${a.dni}</td>
          <td>${a.empleado?a.empleado.nombre:'<span style="color:var(--red)">Sin coincidencia</span>'}</td>
          <td>${a.empleado?'<span class="estado activo">Listo</span>':'<span class="estado anulada">No se va a subir</span>'}</td>
        </tr>`).join('')}</tbody>
    </table>`;
  document.getElementById('pc-btn-subir').style.display = encontrados>0 ? '' : 'none';
}

async function subirRecibos(){
  const periodo=document.getElementById('pc-periodo').value;
  if(!periodo){ toast('Elegí el período.','warn'); return; }
  const validos=_archivosACargar.filter(a=>a.empleado);
  if(!validos.length){ toast('No hay archivos con empleado matcheado.','warn'); return; }

  const btn=document.getElementById('pc-btn-subir');
  btn.disabled=true; btn.textContent='Subiendo...';

  let ok=0, errores=0;
  for(const a of validos){
    try{
      const path = `${a.empleado.id}/${periodo}.pdf`;
      const { error: upErr } = await db.storage.from('recibos-sueldo').upload(path, a.file, { upsert:true, contentType:'application/pdf' });
      if(upErr) throw upErr;

      const { error: insErr } = await db.from('portal_recibos')
        .upsert({ portal_empleado_id:a.empleado.id, periodo, archivo_path:path }, { onConflict:'portal_empleado_id,periodo' });
      if(insErr) throw insErr;
      ok++;
    }catch(e){
      console.error('Error subiendo recibo de', a.dni, e);
      errores++;
    }
  }

  toast(`${ok} recibos cargados${errores?`, ${errores} con error`:''}.`, errores?'warn':'success');
  btn.disabled=false; btn.textContent='Subir recibos';
  document.getElementById('pc-archivos').value='';
  _archivosACargar=[];
  document.getElementById('pc-preview').innerHTML='';
  document.getElementById('pc-btn-subir').style.display='none';
}

// ══════════════════════════════════════════════════════════════
// ESTADO DE FIRMAS
// ══════════════════════════════════════════════════════════════
async function renderPortalEstado(){
  const cont=document.getElementById('contenido');
  const hoy=new Date();
  const periodoDefault=`${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}`;
  cont.innerHTML=`
    <div class="panel-header"><h3>Estado de firmas</h3></div>
    <div style="padding:20px">
      <div class="form-group" style="max-width:220px;margin-bottom:16px">
        <label>Período</label>
        <input type="month" id="pe-estado-periodo" value="${periodoDefault}" onchange="cargarEstadoPeriodo()">
      </div>
      <div id="pe-estado-tabla"><div class="spinner-wrap"><div class="spinner"></div></div></div>
    </div>`;
  await cargarEstadoPeriodo();
}

let _reciboIdsPorEmpleado={};
async function cargarEstadoPeriodo(){
  const periodo=document.getElementById('pe-estado-periodo').value;
  const tabla=document.getElementById('pe-estado-tabla');
  if(!periodo){ tabla.innerHTML=''; return; }

  const { data: recibos } = await db.from('portal_recibos').select('*').eq('periodo',periodo);
  const recibosPorEmpleado={};
  (recibos||[]).forEach(r=>{ recibosPorEmpleado[r.portal_empleado_id]=r; _reciboIdsPorEmpleado[r.id]=r; });

  const activos=_portalEmpleadosCache.filter(pe=>pe.activo);
  const cargados=activos.filter(pe=>recibosPorEmpleado[pe.id]).length;
  const leidos=activos.filter(pe=>recibosPorEmpleado[pe.id]?.leido_en).length;
  const conformes=activos.filter(pe=>recibosPorEmpleado[pe.id]?.conformidad==='conforme').length;
  const noConformes=activos.filter(pe=>recibosPorEmpleado[pe.id]?.conformidad==='no_conforme').length;

  tabla.innerHTML=`
    <div style="display:flex;gap:16px;margin-bottom:14px;font-size:13px;color:var(--muted);flex-wrap:wrap">
      <span>${cargados} / ${activos.length} con recibo cargado</span>
      <span>${leidos} / ${cargados||0} leídos</span>
      <span style="color:var(--green)">${conformes} conformes</span>
      ${noConformes?`<span style="color:var(--red)">${noConformes} no conformes</span>`:''}
    </div>
    <table>
      <thead><tr><th>Empleado</th><th>DNI</th><th>Recibo</th><th>Leído</th><th>Respuesta</th><th></th></tr></thead>
      <tbody>${activos.map(pe=>{
        const r=recibosPorEmpleado[pe.id];
        let respuesta='—';
        if(r?.conformidad==='conforme') respuesta='<span class="estado activo">✓ Conforme</span>';
        else if(r?.conformidad==='no_conforme') respuesta='<span class="estado anulada" style="color:var(--red)">⚠ No conforme</span>';
        else if(r) respuesta='<span class="estado pendiente">Sin responder</span>';
        return `<tr>
          <td>${pe.nombre}</td>
          <td class="mono">${pe.dni}</td>
          <td>${r?'<span class="estado activo">Cargado</span>':'<span class="estado anulada">Sin cargar</span>'}</td>
          <td>${r?.leido_en?'✓ '+fmtFH(r.leido_en):(r?'—':'')}</td>
          <td>${respuesta}</td>
          <td>${r?`<button class="btn btn-sm btn-ghost" onclick="descargarConstancia('${r.id}')">📄 Constancia</button>${r.firmado_en?` <button class="btn btn-sm btn-ghost" onclick="descargarReciboFirmado('${r.id}')">📎 Recibo firmado</button>`:''}`:''}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;
}

// ══════════════════════════════════════════════════════════════
// NOTIFICACIONES — disconformidades
// ══════════════════════════════════════════════════════════════
async function renderNotificaciones(){
  const cont=document.getElementById('contenido');
  cont.innerHTML=`<div class="panel-header"><h3>Disconformidades reportadas</h3></div><div style="padding:20px"><div class="spinner-wrap"><div class="spinner"></div></div></div>`;

  const { data } = await db.from('portal_recibos')
    .select('*,portal_empleados(nombre,dni)')
    .eq('conformidad','no_conforme')
    .order('firmado_en',{ascending:false});

  const rows=data||[];
  document.getElementById('contenido').innerHTML=`
    <div class="panel-header"><h3>Disconformidades reportadas</h3></div>
    <div style="padding:20px">
      ${!rows.length?'<div class="empty">No hay disconformidades reportadas.</div>':`
      <table>
        <thead><tr><th>Empleado</th><th>Período</th><th>Fecha</th><th>Motivo</th><th></th></tr></thead>
        <tbody>${rows.map(r=>`
          <tr>
            <td>${r.portal_empleados?.nombre||'—'} <span style="color:var(--muted);font-size:11px">(${r.portal_empleados?.dni||'—'})</span></td>
            <td class="mono">${fmtPeriodoLabel(r.periodo)}</td>
            <td class="mono" style="font-size:12px">${fmtFH(r.firmado_en)}</td>
            <td style="max-width:320px;font-size:13px">${r.motivo_no_conformidad||'—'}</td>
            <td><button class="btn btn-sm btn-ghost" onclick="descargarConstancia('${r.id}')">📄 Constancia</button> <button class="btn btn-sm btn-ghost" onclick="descargarReciboFirmado('${r.id}')">📎 Recibo firmado</button></td>
          </tr>`).join('')}</tbody>
      </table>`}
    </div>`;
}

// ══════════════════════════════════════════════════════════════
// LEGAJO DIGITAL — revisión de DNI + selfie
// ══════════════════════════════════════════════════════════════
async function renderLegajos(){
  const cont=document.getElementById('contenido');
  const enRevision=_portalEmpleadosCache.filter(pe=>pe.docs_estado==='en_revision');
  const resto=_portalEmpleadosCache.filter(pe=>pe.docs_estado!=='en_revision');

  const filaHtml=(pe)=>`
    <tr>
      <td>${pe.nombre}</td>
      <td class="mono">${pe.dni}</td>
      <td>${estadoDocsBadge(pe.docs_estado)}</td>
      <td style="font-size:12px;color:var(--muted)">${pe.docs_revisado_en?fmtFH(pe.docs_revisado_en)+(pe.docs_revisado_por?' · '+pe.docs_revisado_por:''):'—'}</td>
      <td>${pe.dni_frente_path?`<button class="btn btn-sm btn-primary" onclick="abrirRevisionLegajo('${pe.id}')">Revisar</button>`:'<span style="color:var(--muted);font-size:12px">Sin enviar</span>'}</td>
    </tr>`;

  cont.innerHTML=`
    <div class="panel-header"><h3>Legajo digital — DNI y selfie</h3></div>
    <div style="padding:20px">
      ${enRevision.length?`
      <div style="font-size:11px;color:var(--orange);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px;font-weight:600">Pendientes de revisión (${enRevision.length})</div>
      <table style="margin-bottom:24px">
        <thead><tr><th>Empleado</th><th>DNI</th><th>Estado</th><th>Revisado</th><th></th></tr></thead>
        <tbody>${enRevision.map(filaHtml).join('')}</tbody>
      </table>`:''}
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px">Resto</div>
      <table>
        <thead><tr><th>Empleado</th><th>DNI</th><th>Estado</th><th>Revisado</th><th></th></tr></thead>
        <tbody>${resto.map(filaHtml).join('')}</tbody>
      </table>
    </div>`;
}

function estadoDocsBadge(estado){
  const map={pendiente:['anulada','Sin enviar'],en_revision:['pendiente','En revisión'],aprobado:['activo','Aprobado'],rechazado:['vencida','Rechazado']};
  const [cls,label]=map[estado]||['anulada',estado];
  return `<span class="estado ${cls}">${label}</span>`;
}

let _legajoActualId=null;
async function abrirRevisionLegajo(peId){
  const pe=_portalEmpleadosCache.find(p=>p.id===peId);
  if(!pe) return;
  _legajoActualId=peId;

  const urls={};
  for(const [campo,path] of [['frente',pe.dni_frente_path],['dorso',pe.dni_dorso_path],['selfie',pe.selfie_path]]){
    if(!path){ urls[campo]=null; continue; }
    const { data, error } = await db.storage.from('legajo-docs').download(path);
    urls[campo] = error ? null : URL.createObjectURL(data);
  }

  const html=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
      <div><div style="font-size:11px;color:var(--muted);margin-bottom:6px">DNI Frente</div>${urls.frente?`<img src="${urls.frente}" style="width:100%;border-radius:8px">`:'<div style="color:var(--muted);font-size:12px">No disponible</div>'}</div>
      <div><div style="font-size:11px;color:var(--muted);margin-bottom:6px">DNI Dorso</div>${urls.dorso?`<img src="${urls.dorso}" style="width:100%;border-radius:8px">`:'<div style="color:var(--muted);font-size:12px">No disponible</div>'}</div>
      <div style="grid-column:1/-1;max-width:240px"><div style="font-size:11px;color:var(--muted);margin-bottom:6px">Selfie</div>${urls.selfie?`<img src="${urls.selfie}" style="width:100%;border-radius:8px">`:'<div style="color:var(--muted);font-size:12px">No disponible</div>'}</div>
    </div>
    <div class="form-group" id="grupo-motivo-rechazo" style="display:none;margin-bottom:14px">
      <label>Motivo del rechazo</label>
      <input type="text" id="motivo-rechazo-legajo" placeholder="Ej: foto borrosa, no coincide con la selfie...">
    </div>`;

  const modalHtml=`
    <div class="modal-overlay show" id="modal-legajo" onclick="if(event.target===this)cerrarModal('modal-legajo')">
      <div class="modal" style="max-width:560px">
        <h3>Revisar legajo — ${pe.nombre} (${pe.dni})</h3>
        ${html}
        <div class="modal-footer">
          <button class="btn btn-ghost" onclick="cerrarModal('modal-legajo')">Cerrar</button>
          <button class="btn btn-danger" onclick="rechazarLegajo()">Rechazar</button>
          <button class="btn btn-success" onclick="aprobarLegajo()">✓ Aprobar</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modal-legajo-root')?.remove();
  const div=document.createElement('div');
  div.id='modal-legajo-root';
  div.innerHTML=modalHtml;
  document.body.appendChild(div);
}

async function aprobarLegajo(){
  const { data:{ user } } = await db.auth.getUser();
  await db.from('portal_empleados').update({
    docs_estado:'aprobado', docs_revisado_por:user?.email||'admin', docs_revisado_en:new Date().toISOString(), docs_motivo_rechazo:null,
  }).eq('id', _legajoActualId);
  toast('Legajo aprobado','success');
  document.getElementById('modal-legajo-root')?.remove();
  cargarTabRecibos();
  cargarBadgeNoConforme();
}

async function rechazarLegajo(){
  const grupoMotivo=document.getElementById('grupo-motivo-rechazo');
  if(grupoMotivo.style.display==='none'){ grupoMotivo.style.display=''; return; }
  const motivo=document.getElementById('motivo-rechazo-legajo').value.trim();
  if(!motivo){ toast('Ingresá el motivo del rechazo.','warn'); return; }
  const { data:{ user } } = await db.auth.getUser();
  await db.from('portal_empleados').update({
    docs_estado:'rechazado', docs_revisado_por:user?.email||'admin', docs_revisado_en:new Date().toISOString(), docs_motivo_rechazo:motivo,
  }).eq('id', _legajoActualId);
  toast('Legajo rechazado — el empleado va a tener que volver a subir las fotos','warn');
  document.getElementById('modal-legajo-root')?.remove();
  cargarTabRecibos();
  cargarBadgeNoConforme();
}

// AVISOS Y FORMULARIOS
// ══════════════════════════════════════════════════════════════
let _preguntasNuevoAviso=[];

async function renderAvisos(){
  const cont=document.getElementById('contenido');
  const { data: avisos } = await db.from('portal_notificaciones').select('*').order('created_at',{ascending:false});

  cont.innerHTML=`
    <div class="panel-header">
      <h3>Avisos y formularios</h3>
      <button class="btn btn-primary btn-sm" onclick="abrirNuevoAviso()">+ Nuevo aviso</button>
    </div>
    <div style="padding:20px">
      ${!avisos||!avisos.length?'<div class="empty">Todavía no mandaste ningún aviso.</div>':`
      <table>
        <thead><tr><th>Título</th><th>Preguntas</th><th>Creado</th><th>Activo</th><th></th></tr></thead>
        <tbody>${avisos.map(a=>`
          <tr>
            <td>${a.titulo}</td>
            <td class="mono">${(a.preguntas||[]).length}</td>
            <td class="mono" style="font-size:12px">${fmtFH(a.created_at)}</td>
            <td><span class="estado ${a.activa?'activo':'anulada'}">${a.activa?'Sí':'No'}</span></td>
            <td style="display:flex;gap:6px">
              <button class="btn btn-sm btn-ghost" onclick="verRespuestasAviso('${a.id}','${a.titulo.replace(/'/g,"&apos;")}')">Ver respuestas</button>
              <button class="btn btn-sm btn-ghost" onclick="toggleActivoAviso('${a.id}',${a.activa})">${a.activa?'Desactivar':'Activar'}</button>
            </td>
          </tr>`).join('')}</tbody>
      </table>`}
    </div>`;
}

function abrirNuevoAviso(){
  _preguntasNuevoAviso=[];
  const modalHtml=`
    <div class="modal-overlay show" id="modal-aviso" onclick="if(event.target===this)cerrarModal('modal-aviso')">
      <div class="modal" style="max-width:520px">
        <h3>Nuevo aviso / formulario</h3>
        <div class="form-group" style="margin-bottom:14px">
          <label>Título</label>
          <input type="text" id="av-titulo" placeholder="Ej: Actualización de datos de contacto">
        </div>
        <div class="form-group" style="margin-bottom:14px">
          <label>Mensaje</label>
          <textarea id="av-cuerpo" rows="3" placeholder="Texto del aviso (opcional si es solo un formulario)"></textarea>
        </div>
        <div style="margin-bottom:10px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px">Preguntas (opcional — respuesta de texto libre)</div>
        <div id="av-preguntas-list"></div>
        <button class="btn btn-ghost btn-sm" onclick="agregarPreguntaAviso()">+ Agregar pregunta</button>
        <div class="modal-footer">
          <button class="btn btn-ghost" onclick="cerrarModal('modal-aviso')">Cancelar</button>
          <button class="btn btn-primary" onclick="guardarAviso()">Enviar aviso</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modal-aviso-root')?.remove();
  const div=document.createElement('div');
  div.id='modal-aviso-root';
  div.innerHTML=modalHtml;
  document.body.appendChild(div);
}

function agregarPreguntaAviso(){
  const id='p'+Date.now();
  _preguntasNuevoAviso.push({id, texto:''});
  renderPreguntasAviso();
}
function renderPreguntasAviso(){
  const cont=document.getElementById('av-preguntas-list');
  cont.innerHTML=_preguntasNuevoAviso.map((p,i)=>`
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <input type="text" value="${p.texto}" placeholder="Texto de la pregunta" oninput="_preguntasNuevoAviso[${i}].texto=this.value" style="flex:1">
      <button class="btn btn-sm btn-danger" onclick="_preguntasNuevoAviso.splice(${i},1);renderPreguntasAviso()">✕</button>
    </div>`).join('');
}

async function guardarAviso(){
  const titulo=document.getElementById('av-titulo').value.trim();
  const cuerpo=document.getElementById('av-cuerpo').value.trim();
  const preguntas=_preguntasNuevoAviso.filter(p=>p.texto.trim()).map(p=>({id:p.id,texto:p.texto.trim()}));
  if(!titulo){ toast('Ingresá un título.','warn'); return; }

  try{
    const { error } = await db.from('portal_notificaciones').insert({ titulo, cuerpo:cuerpo||null, preguntas, activa:true });
    if(error) throw error;
    toast('Aviso enviado a todos los empleados del portal','success');
    document.getElementById('modal-aviso-root')?.remove();
    cargarTabRecibos();
  }catch(e){ toast('Error: '+(e?.message||String(e)),'error'); }
}

async function toggleActivoAviso(id, activaActual){
  await db.from('portal_notificaciones').update({ activa: !activaActual }).eq('id', id);
  cargarTabRecibos();
}

async function verRespuestasAviso(avisoId, titulo){
  const { data: aviso } = await db.from('portal_notificaciones').select('*').eq('id',avisoId).single();
  const { data: resp } = await db.from('portal_notificacion_respuestas')
    .select('*,portal_empleados(nombre,dni)').eq('notificacion_id',avisoId);

  const preguntas=aviso?.preguntas||[];
  const filas=(resp||[]).map(r=>{
    const respTxt = preguntas.length
      ? preguntas.map(p=>`<div style="font-size:12px"><strong>${p.texto}:</strong> ${r.respuestas?.[p.id]||'—'}</div>`).join('')
      : (r.respondido_en?'<span style="color:var(--green);font-size:12px">✓ Leído/confirmado</span>':'');
    return `<tr>
      <td>${r.portal_empleados?.nombre||'—'} <span style="color:var(--muted);font-size:11px">(${r.portal_empleados?.dni||'—'})</span></td>
      <td style="font-size:12px">${r.leido_en?fmtFH(r.leido_en):'Sin leer'}</td>
      <td style="font-size:12px">${r.respondido_en?fmtFH(r.respondido_en):'—'}</td>
      <td>${respTxt}</td>
    </tr>`;
  }).join('');

  const modalHtml=`
    <div class="modal-overlay show" id="modal-resp-aviso" onclick="if(event.target===this)cerrarModal('modal-resp-aviso')">
      <div class="modal" style="max-width:680px">
        <h3>Respuestas — ${titulo}</h3>
        <div style="overflow-x:auto;max-height:400px;overflow-y:auto">
          <table>
            <thead><tr><th>Empleado</th><th>Leído</th><th>Respondido</th><th>Respuesta</th></tr></thead>
            <tbody>${filas||'<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:20px">Todavía nadie lo vio.</td></tr>'}</tbody>
          </table>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" onclick="cerrarModal('modal-resp-aviso')">Cerrar</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modal-resp-aviso-root')?.remove();
  const div=document.createElement('div');
  div.id='modal-resp-aviso-root';
  div.innerHTML=modalHtml;
  document.body.appendChild(div);
}

// ══════════════════════════════════════════════════════════════
// CONSTANCIA DESCARGABLE (para presentar a clientes)
// ══════════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════
// RECIBO FIRMADO — el PDF original + una página con el sello de firma
// digital del empleado, para descargar y presentar a terceros
// ══════════════════════════════════════════════════════════════
async function descargarReciboFirmado(reciboId){
  const { data: r, error } = await db.from('portal_recibos')
    .select('*,portal_empleados(nombre,dni)').eq('id', reciboId).single();
  if(error || !r){ toast('No se pudo cargar el recibo.','error'); return; }
  if(!r.firmado_en){ toast('Este recibo todavía no fue confirmado por el empleado.','warn'); return; }

  try{
    const { data: pdfBlob, error: dlErr } = await db.storage.from('recibos-sueldo').download(r.archivo_path);
    if(dlErr) throw dlErr;
    const bytes = await pdfBlob.arrayBuffer();

    const { PDFDocument, rgb, StandardFonts } = PDFLib;
    const pdfDoc = await PDFDocument.load(bytes);
    const font = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
    const fontN = await pdfDoc.embedFont(StandardFonts.Helvetica);

    const pagina = pdfDoc.addPage([420, 300]); // página nueva chica, tipo "sello", al final
    const fecha = new Date(r.firmado_en);
    const fechaStr = fecha.toLocaleDateString('es-AR');
    const horaStr = fecha.toLocaleTimeString('es-AR');
    const esConforme = r.conformidad === 'conforme';

    let y = 260;
    pagina.drawText('Constancia de firma digital', { x:30, y, size:14, font, color: rgb(0.1,0.1,0.1) });
    y -= 30;
    const lineas = [
      [`Firmado digitalmente por:`, r.portal_empleados?.nombre||'—'],
      [`Documento (DNI):`, r.portal_empleados?.dni||'—'],
      [`Fecha:`, fechaStr],
      [`Hora:`, horaStr],
      [`IP de origen:`, r.firmado_ip||'—'],
      [`Conformidad:`, esConforme?'CONFORME':'NO CONFORME'],
    ];
    lineas.forEach(([label,val])=>{
      pagina.drawText(label, { x:30, y, size:10, font, color: rgb(0.3,0.3,0.3) });
      pagina.drawText(String(val), { x:220, y, size:10, font:fontN, color: rgb(0,0,0) });
      y -= 20;
    });

    if(!esConforme && r.motivo_no_conformidad){
      y -= 6;
      pagina.drawText('Motivo de la disconformidad:', { x:30, y, size:10, font, color: rgb(0.6,0.1,0.1) });
      y -= 16;
      pagina.drawText(r.motivo_no_conformidad.slice(0,200), { x:30, y, size:9, font:fontN, color: rgb(0,0,0), maxWidth:360 });
    }

    y = 40;
    pagina.drawText('Generado automáticamente por el Portal de Recibos — Hidromec SRL / Placemem SRL', { x:30, y, size:7, font:fontN, color: rgb(0.5,0.5,0.5) });

    const outBytes = await pdfDoc.save();
    const blob = new Blob([outBytes], { type:'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `recibo-firmado-${r.portal_empleados?.dni||'recibo'}-${r.periodo}.pdf`;
    a.click();
    URL.revokeObjectURL(url);
  }catch(e){
    toast('Error al generar el PDF: '+(e?.message||String(e)),'error');
  }
}


async function descargarConstancia(reciboId){
  const { data: r, error } = await db.from('portal_recibos')
    .select('*,portal_empleados(nombre,dni,email)')
    .eq('id', reciboId).single();
  if(error || !r){ toast('No se pudo cargar el recibo.','error'); return; }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ format:'a4', unit:'mm' });
  const L=15, R=195, W=180;
  let y=20;

  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('Constancia de Recepción de Recibo de Sueldo', L, y);
  y+=10;
  doc.setDrawColor(200,200,200); doc.line(L,y,R,y);
  y+=10;

  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  const filas=[
    ['Empleado', r.portal_empleados?.nombre||'—'],
    ['Documento (DNI)', r.portal_empleados?.dni||'—'],
    ['Período', fmtPeriodoLabel(r.periodo)],
    ['Fecha de carga', fmtFH(r.fecha_carga)],
    ['Fecha de lectura', fmtFH(r.leido_en)],
    ['IP de lectura', r.leido_ip||'—'],
    ['Fecha de respuesta', fmtFH(r.firmado_en)],
    ['IP de respuesta', r.firmado_ip||'—'],
    ['Conformidad', r.conformidad==='conforme'?'CONFORME':(r.conformidad==='no_conforme'?'NO CONFORME':'Sin responder')],
  ];
  filas.forEach(([label,val])=>{
    doc.setFont('helvetica','bold'); doc.text(label+':', L, y);
    doc.setFont('helvetica','normal'); doc.text(String(val), L+55, y);
    y+=8;
  });

  if(r.conformidad==='no_conforme'){
    y+=4;
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(180,40,40);
    doc.text('Motivo de la disconformidad:', L, y);
    y+=6;
    doc.setFont('helvetica','normal'); doc.setTextColor(0,0,0);
    const lineas=doc.splitTextToSize(r.motivo_no_conformidad||'—', W);
    doc.text(lineas, L, y);
    y+=lineas.length*5;
  }

  y+=10;
  doc.setDrawColor(200,200,200); doc.line(L,y,R,y);
  y+=8;
  doc.setFont('helvetica','italic'); doc.setFontSize(8); doc.setTextColor(120,120,120);
  const nota=doc.splitTextToSize(
    'Este documento es una constancia generada automáticamente por el sistema del Portal de Recibos, en base a la trazabilidad de acceso registrada (usuario único, fecha, hora e IP). No reemplaza asesoramiento legal.',
    W
  );
  doc.text(nota, L, y);
  y+=nota.length*4+10;
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(150,150,150);
  doc.text('Generado el '+new Date().toLocaleString('es-AR'), L, y);

  doc.save(`constancia-${(r.portal_empleados?.dni||'recibo')}-${r.periodo}.pdf`);
}
